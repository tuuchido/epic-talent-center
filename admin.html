<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>EPIC – Quản lý Bản đồ sao</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Varela+Round&display=swap"
      rel="stylesheet">


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Varela Round",sans-serif;
    background:#f7f8fc;
    color:#17204a;
    min-height:100vh;
}


/* =====================================================
   HEADER
===================================================== */

header{
    height:75px;

    background:white;

    border-bottom:1px solid #e8eaf2;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 35px;

    position:sticky;

    top:0;

    z-index:100;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;

    text-decoration:none;

    color:#102576;
}

.brand img{
    width:62px;
    height:48px;
    object-fit:contain;
}

.brand-title{
    font-family:"Cherry Bomb One",cursive;
    font-size:22px;
}

.brand-title small{
    display:block;
    font-family:"Varela Round",sans-serif;
    font-size:9px;
    letter-spacing:2px;
    opacity:.55;
}

.header-actions{
    display:flex;
    gap:10px;
}

.header-btn{
    text-decoration:none;

    border:1px solid #dfe2ed;

    color:#102576;

    padding:10px 16px;

    border-radius:30px;

    background:white;

    cursor:pointer;

    font-family:inherit;
}

.header-btn:hover{
    background:#102576;
    color:white;
}


/* =====================================================
   LOGIN
===================================================== */

.login-page{
    min-height:calc(100vh - 75px);

    display:flex;

    justify-content:center;

    align-items:center;

    padding:30px;
}

.login-box{
    width:min(430px,100%);

    background:white;

    padding:40px;

    border-radius:28px;

    box-shadow:
        0 20px 60px rgba(16,37,118,.1);

    border:1px solid #edf0f7;

    text-align:center;
}

.login-icon{
    font-size:55px;
}

.login-box h1{
    font-family:"Cherry Bomb One",cursive;

    color:#102576;

    font-size:32px;

    margin-top:10px;
}

.login-box p{
    color:#777f9b;

    margin:8px 0 25px;
}

.form-group{
    text-align:left;

    margin-bottom:15px;
}

label{
    display:block;

    font-size:13px;

    font-weight:bold;

    margin-bottom:7px;

    color:#28315b;
}

input,
select,
textarea{
    width:100%;

    border:1px solid #dfe2ed;

    border-radius:13px;

    padding:13px 14px;

    font-family:inherit;

    font-size:14px;

    outline:none;

    background:white;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#102576;

    box-shadow:
        0 0 0 3px rgba(16,37,118,.08);
}

button{
    font-family:inherit;
}

.primary-btn{
    width:100%;

    border:0;

    border-radius:14px;

    padding:14px;

    background:#102576;

    color:white;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.primary-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 8px 20px rgba(16,37,118,.2);
}

.message{
    min-height:20px;

    margin-top:14px;

    font-size:13px;
}


/* =====================================================
   ADMIN APP
===================================================== */

.admin-page{
    display:none;

    padding:35px 20px 70px;
}

.container{
    max-width:1150px;

    margin:auto;
}

.page-heading{
    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;
}

.page-heading h1{
    font-family:"Cherry Bomb One",cursive;

    font-size:42px;

    color:#102576;
}

.page-heading p{
    color:#77809c;

    margin-top:4px;
}


/* =====================================================
   CARDS
===================================================== */

.panel{
    background:white;

    border-radius:25px;

    border:1px solid #e9ebf3;

    padding:25px;

    box-shadow:
        0 10px 40px rgba(16,37,118,.05);

    margin-bottom:25px;
}

.panel-title{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:20px;
}

.panel-title h2{
    font-size:20px;

    color:#102576;
}


/* =====================================================
   FORM
===================================================== */

.form-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:15px;
}

.full{
    grid-column:1/-1;
}

.form-actions{
    display:flex;

    gap:10px;

    margin-top:5px;
}

.save-btn{
    border:0;

    background:#102576;

    color:white;

    border-radius:12px;

    padding:13px 22px;

    cursor:pointer;

    font-weight:bold;
}

.cancel-btn{
    border:0;

    background:#eef0f7;

    color:#102576;

    border-radius:12px;

    padding:13px 22px;

    cursor:pointer;
}


/* =====================================================
   TABLE
===================================================== */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;

    border-collapse:collapse;

    min-width:760px;
}

th{
    text-align:left;

    background:#f5f6fb;

    color:#59617d;

    padding:13px;

    font-size:12px;

    letter-spacing:.5px;
}

td{
    padding:14px 13px;

    border-bottom:1px solid #edf0f5;

    font-size:13px;

    vertical-align:middle;
}

.student-cell{
    display:flex;

    align-items:center;

    gap:10px;
}

.mini-star{
    color:#E7C84A;

    font-size:28px;

    text-shadow:
        0 0 8px rgba(231,200,74,.6);
}

.badge{
    display:inline-block;

    padding:5px 9px;

    border-radius:20px;

    background:#edf0ff;

    color:#102576;

    font-size:11px;
}

.status{
    font-size:11px;

    padding:5px 9px;

    border-radius:20px;
}

.status.on{
    background:#e8f8ef;
    color:#18864b;
}

.status.off{
    background:#fcecec;
    color:#b12828;
}

.action-btn{
    border:0;

    padding:7px 10px;

    border-radius:8px;

    cursor:pointer;

    margin-right:4px;

    font-size:11px;
}

.edit-btn{
    background:#eef0ff;
    color:#102576;
}

.delete-btn{
    background:#fcebec;
    color:#b51f2f;
}

.toggle-btn{
    background:#fff4d5;
    color:#856500;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:700px){

    header{
        padding:0 15px;
    }

    .brand-title{
        font-size:17px;
    }

    .header-btn{
        padding:8px 10px;
        font-size:11px;
    }

    .page-heading{
        display:block;
    }

    .page-heading h1{
        font-size:34px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .panel{
        padding:18px;
    }

}

</style>

</head>


<body>


<header>

    <a class="brand"
       href="index.html">

        <img
            src="assets/logo1A.png"
            alt="EPIC">

        <div class="brand-title">

            EPIC

            <small>
                TALENT CENTER
            </small>

        </div>

    </a>


    <div class="header-actions">

        <a
            class="header-btn"
            href="star-map.html"
            target="_blank">

            ⭐ Bản đồ sao

        </a>

        <button
            class="header-btn"
            id="logoutBtn">

            Đăng xuất

        </button>

    </div>

</header>


<!-- ===================================================
     LOGIN
=================================================== -->

<section
    class="login-page"
    id="loginPage">

    <div class="login-box">

        <div class="login-icon">
            🔐
        </div>

        <h1>
            EPIC Admin
        </h1>

        <p>
            Đăng nhập để quản lý Bản đồ sao EPIC
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    required
                    placeholder="Email quản trị">

            </div>


            <div class="form-group">

                <label>
                    Mật khẩu
                </label>

                <input
                    type="password"
                    id="password"
                    required
                    placeholder="Mật khẩu">

            </div>


            <button
                class="primary-btn"
                type="submit">

                Đăng nhập

            </button>

        </form>


        <div
            class="message"
            id="loginMessage">
        </div>

    </div>

</section>


<!-- ===================================================
     ADMIN
=================================================== -->

<main
    class="admin-page"
    id="adminPage">

<div class="container">


    <div class="page-heading">

        <div>

            <h1>
                Bản đồ sao EPIC ⭐
            </h1>

            <p>
                Quản lý những ngôi sao tài năng của học viên.
            </p>

        </div>

    </div>


    <!-- FORM -->

    <section class="panel">

        <div class="panel-title">

            <h2 id="formTitle">
                ✦ Thêm ngôi sao mới
            </h2>

        </div>


        <form id="studentForm">

            <input
                type="hidden"
                id="studentId">


            <div class="form-grid">


                <div>

                    <label>
                        Tên học viên *
                    </label>

                    <input
                        id="studentName"
                        required
                        placeholder="Ví dụ: Minh Anh">

                </div>


                <div>

                    <label>
                        Môn năng khiếu *
                    </label>

                    <select
                        id="program"
                        required>

                        <option value="">
                            Chọn môn
                        </option>

                        <option value="Mỹ thuật">
                            🎨 Mỹ thuật
                        </option>

                        <option value="Piano">
                            🎹 Piano
                        </option>

                        <option value="Dance">
                            💃 Dance
                        </option>

                    </select>

                </div>


                <div>

                    <label>
                        Thành tích *
                    </label>

                    <textarea
                        id="achievement"
                        rows="3"
                        required
                        placeholder="Ví dụ: Hoàn thành tác phẩm...">
                    </textarea>

                </div>


                <div>

                    <label>
                        Năm
                    </label>

                    <input
                        id="year"
                        placeholder="2026">

                </div>


                <div>

                    <label>
                        Vị trí ngang
                    </label>

                    <input
                        id="positionX"
                        type="number"
                        min="5"
                        max="95"
                        value="50">

                </div>


                <div>

                    <label>
                        Vị trí dọc
                    </label>

                    <input
                        id="positionY"
                        type="number"
                        min="8"
                        max="90"
                        value="50">

                </div>


            </div>


            <div
                class="form-actions">

                <button
                    type="submit"
                    class="save-btn">

                    ⭐ Lưu ngôi sao

                </button>

                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelEdit">

                    Hủy

                </button>

            </div>


            <div
                class="message"
                id="formMessage">
            </div>


        </form>

    </section>


    <!-- LIST -->

    <section class="panel">

        <div class="panel-title">

            <h2>
                Danh sách học viên
            </h2>

            <span
                id="studentCount"
                class="badge">

                0 ngôi sao

            </span>

        </div>


        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>
                            HỌC VIÊN
                        </th>

                        <th>
                            MÔN
                        </th>

                        <th>
                            THÀNH TÍCH
                        </th>

                        <th>
                            NĂM
                        </th>

                        <th>
                            TRẠNG THÁI
                        </th>

                        <th>
                            THAO TÁC
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="studentList">

                </tbody>

            </table>

        </div>

    </section>


</div>

</main>


<script type="module">

import {

    auth,
    db,

    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged,

    collection,
    addDoc,
    updateDoc,
    deleteDoc,
    doc,
    onSnapshot,
    serverTimestamp

} from "./firebase-config.js";


/* =====================================================
   ELEMENTS
===================================================== */

const loginPage =
    document.getElementById("loginPage");

const adminPage =
    document.getElementById("adminPage");

const loginForm =
    document.getElementById("loginForm");

const loginMessage =
    document.getElementById("loginMessage");

const logoutBtn =
    document.getElementById("logoutBtn");

const studentForm =
    document.getElementById("studentForm");

const studentId =
    document.getElementById("studentId");

const studentName =
    document.getElementById("studentName");

const program =
    document.getElementById("program");

const achievement =
    document.getElementById("achievement");

const year =
    document.getElementById("year");

const positionX =
    document.getElementById("positionX");

const positionY =
    document.getElementById("positionY");

const studentList =
    document.getElementById("studentList");

const studentCount =
    document.getElementById("studentCount");

const formMessage =
    document.getElementById("formMessage");

const formTitle =
    document.getElementById("formTitle");

const cancelEdit =
    document.getElementById("cancelEdit");


/* =====================================================
   AUTH STATE
===================================================== */

let unsubscribeStudents = null;


onAuthStateChanged(
    auth,
    user => {

        if(user){

            loginPage.style.display =
                "none";

            adminPage.style.display =
                "block";

            loadStudents();

        }
        else{

            loginPage.style.display =
                "flex";

            adminPage.style.display =
                "none";

            if(unsubscribeStudents){

                unsubscribeStudents();

                unsubscribeStudents =
                    null;

            }

        }

    }
);


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        loginMessage.textContent =
            "Đang đăng nhập...";

        try{

            await signInWithEmailAndPassword(

                auth,

                document
                .getElementById("email")
                .value,

                document
                .getElementById("password")
                .value

            );

            loginMessage.textContent =
                "";

        }
        catch(error){

            console.error(error);

            loginMessage.textContent =
                "❌ Email hoặc mật khẩu không đúng.";

        }

    }
);


/* =====================================================
   LOGOUT
===================================================== */

logoutBtn.addEventListener(
    "click",
    async () => {

        await signOut(auth);

    }
);


/* =====================================================
   LOAD STUDENTS
===================================================== */

function loadStudents(){

    const studentsRef =
        collection(
            db,
            "students"
        );


    unsubscribeStudents =
        onSnapshot(

            studentsRef,

            snapshot => {

                const students =
                    snapshot.docs.map(
                        item => ({
                            id:item.id,
                            ...item.data()
                        })
                    );


                renderStudents(students);

            },

            error => {

                console.error(error);

                formMessage.textContent =
                    "❌ Không thể tải dữ liệu. Kiểm tra Firestore Rules.";

            }

        );

}


/* =====================================================
   RENDER
===================================================== */

function renderStudents(students){

    studentList.innerHTML =
        "";

    studentCount.textContent =
        `${students.length} ngôi sao`;


    if(students.length === 0){

        studentList.innerHTML = `

            <tr>

                <td colspan="6"
                    style="text-align:center;padding:35px;color:#8990a8">

                    Chưa có học viên nào.
                    Hãy thêm ngôi sao đầu tiên ⭐

                </td>

            </tr>

        `;

        return;

    }


    students.forEach(student => {

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>

                <div class="student-cell">

                    <span class="mini-star">
                        ★
                    </span>

                    <strong>
                        ${escapeHTML(
                            student.name ||
                            "Học viên"
                        )}
                    </strong>

                </div>

            </td>


            <td>

                <span class="badge">

                    ${escapeHTML(
                        student.program ||
                        ""
                    )}

                </span>

            </td>


            <td style="max-width:300px">

                ${escapeHTML(
                    student.achievement ||
                    ""
                )}

            </td>


            <td>

                ${escapeHTML(
                    student.year ||
                    ""
                )}

            </td>


            <td>

                <span class="status ${
                    student.visible === false
                    ? "off"
                    : "on"
                }">

                    ${
                        student.visible === false
                        ? "Đang ẩn"
                        : "Đang hiện"
                    }

                </span>

            </td>


            <td>

                <button
                    class="action-btn edit-btn"
                    data-edit="${student.id}">

                    Sửa

                </button>

                <button
                    class="action-btn toggle-btn"
                    data-toggle="${student.id}"
                    data-visible="${student.visible !== false}">

                    ${
                        student.visible === false
                        ? "Hiện"
                        : "Ẩn"
                    }

                </button>

                <button
                    class="action-btn delete-btn"
                    data-delete="${student.id}">

                    Xóa

                </button>

            </td>

        `;


        studentList.appendChild(row);

    });


    /* EDIT */

    document
    .querySelectorAll("[data-edit]")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const student =
                    students.find(
                        item =>
                        item.id ===
                        button.dataset.edit
                    );

                if(student){

                    startEdit(student);

                }

            }
        );

    });


    /* TOGGLE */

    document
    .querySelectorAll("[data-toggle]")
    .forEach(button => {

        button.addEventListener(
            "click",
            async () => {

                const id =
                    button.dataset.toggle;

                const visible =
                    button.dataset.visible ===
                    "true";

                try{

                    await updateDoc(

                        doc(
                            db,
                            "students",
                            id
                        ),

                        {
                            visible:
                                !visible
                        }

                    );

                }
                catch(error){

                    alert(
                        "Không thể thay đổi trạng thái."
                    );

                    console.error(error);

                }

            }
        );

    });


    /* DELETE */

    document
    .querySelectorAll("[data-delete]")
    .forEach(button => {

        button.addEventListener(
            "click",
            async () => {

                const id =
                    button.dataset.delete;

                if(
                    !confirm(
                        "Bạn có chắc muốn xóa ngôi sao này?"
                    )
                ){

                    return;

                }


                try{

                    await deleteDoc(

                        doc(
                            db,
                            "students",
                            id
                        )

                    );

                }
                catch(error){

                    alert(
                        "Không thể xóa dữ liệu."
                    );

                    console.error(error);

                }

            }
        );

    });

}


/* =====================================================
   ADD / UPDATE
===================================================== */

studentForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        formMessage.textContent =
            "Đang lưu...";


        const data = {

            name:
                studentName.value.trim(),

            program:
                program.value,

            achievement:
                achievement.value.trim(),

            year:
                year.value.trim() ||
                new Date().getFullYear().toString(),

            x:
                Number(positionX.value) || 50,

            y:
                Number(positionY.value) || 50,

            visible:true

        };


        try{

            if(studentId.value){

                await updateDoc(

                    doc(
                        db,
                        "students",
                        studentId.value
                    ),

                    data

                );

                formMessage.textContent =
                    "✅ Đã cập nhật ngôi sao.";

            }
            else{

                data.createdAt =
                    serverTimestamp();


                await addDoc(

                    collection(
                        db,
                        "students"
                    ),

                    data

                );

                formMessage.textContent =
                    "⭐ Đã thêm ngôi sao mới.";

            }


            resetForm();

        }
        catch(error){

            console.error(error);

            formMessage.textContent =
                "❌ Không thể lưu. Hãy kiểm tra Firestore Rules.";

        }

    }
);


/* =====================================================
   EDIT
===================================================== */

function startEdit(student){

    studentId.value =
        student.id;

    studentName.value =
        student.name || "";

    program.value =
        student.program || "";

    achievement.value =
        student.achievement || "";

    year.value =
        student.year || "";

    positionX.value =
        student.x || 50;

    positionY.value =
        student.y || 50;

    formTitle.textContent =
        "✦ Chỉnh sửa ngôi sao";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   RESET
===================================================== */

cancelEdit.addEventListener(
    "click",
    resetForm
);


function resetForm(){

    studentId.value =
        "";

    studentForm.reset();

    positionX.value =
        50;

    positionY.value =
        50;

    formTitle.textContent =
        "✦ Thêm ngôi sao mới";

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

    return String(value)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}

</script>


</body>
</html>
